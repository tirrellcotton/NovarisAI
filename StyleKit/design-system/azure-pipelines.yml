trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: 20.x

  - script: npm install
    displayName: Install dependencies

  - script: npm run build
    displayName: Build StyleKit

  - task: PublishPipelineArtifact@1
    displayName: Publish StyleKit bundle
    inputs:
      targetPath: $(Build.SourcesDirectory)/dist
      artifact: stylekit-css
      publishLocation: pipeline
