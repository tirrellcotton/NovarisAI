<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1220">
  <title>Novaris AI is offline</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0d1220; color: #edf2ff; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
    main { width: min(32rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #3f4b72; border-radius: 0.5rem; background: #161b2d; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2); }
    h1 { margin-top: 0; color: #edf2ff; }
    p { color: #c6d0ee; line-height: 1.55; }
    button { padding: 0.65rem 1rem; border: 0; border-radius: 0.25rem; background: #4e77ff; color: #f7f9ff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>Novaris AI is offline</h1>
    <p>The application shell is available, but chat requests require a connection to Novaris AI and Ollama.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
